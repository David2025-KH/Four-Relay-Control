<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home Control</title>

<!-- Firebase Compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#4e73df,#1cc88a);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

#login-container {
  background:white;
  padding:50px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  text-align:center;
  width:90%;
  max-width:420px;
}

#login-container h1 {
  margin-bottom:10px;
  font-size:2rem;
  color:#333;
}

#login-container p {
  color:#666;
  margin-bottom:30px;
  font-size:1rem;
}

#googleSignInBtn {
  background:#4285F4;
  color:white;
  border:none;
  border-radius:8px;
  font-size:1.1rem;
  padding:14px 30px;
  cursor:pointer;
  width:100%;
  transition:0.3s;
}

#googleSignInBtn:hover {
  opacity:0.9;
  transform:scale(1.03);
}

/* Dashboard */
#dashboard {
  display:none;
  flex-direction:column;
  align-items:center;
  padding:20px;
  width:100%;
  max-width:450px;
}

#user-info {
  margin-bottom:15px;
  font-size:1rem;
  color:#444;
  text-align:center;
}

#logoutBtn {
  margin-bottom:20px;
  padding:10px 24px;
  font-size:1rem;
  border:none;
  border-radius:8px;
  background:#f44336;
  color:white;
  cursor:pointer;
}

#logoutBtn:hover { opacity:0.9; }

h2 {
  margin-bottom:10px;
  color:#333;
}

#datetime {
  margin-bottom:20px;
  font-size:1rem;
  color:#555;
}

.relay-card {
  background:white;
  padding:20px 40px;
  margin:10px;
  border-radius:14px;
  box-shadow:0 6px 14px rgba(0,0,0,0.15);
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  max-width:350px;
  transition:0.3s;
}

.relay-card.active {
  border-left:8px solid #4CAF50;
}

.relay-info {
  display:flex;
  align-items:center;
  gap:15px;
}

.relay-info img {
  width:50px;
  height:50px;
}

button.relay-btn {
  padding:10px 22px;
  font-size:1rem;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

button.relay-btn.on { background:#4CAF50; color:white; }
button.relay-btn.off { background:#f44336; color:white; }

button.relay-btn:hover { opacity:0.9; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-container">
  <h1>Welcome to Smart Home Control</h1>
  <p>Experience the future of living.  
  Control your home anytime, anywhere.</p>
  <button id="googleSignInBtn">Sign in with Google</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div id="user-info"></div>
  <button id="logoutBtn">Logout</button>

  <h2>Relay Control Dashboard</h2>
  <div id="datetime"></div>

  <div style="margin-bottom:15px;">
    <label>Select Device:</label>
    <select id="deviceSelect"></select>
  </div>

  <div class="relay-card" id="relay1-card">
    <div class="relay-info">
      <img id="relay1-img" src="Light off.png">
      <span>Relay 1</span>
    </div>
    <button class="relay-btn off" id="relay1-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay2-card">
    <div class="relay-info">
      <img id="relay2-img" src="Light off.png">
      <span>Relay 2</span>
    </div>
    <button class="relay-btn off" id="relay2-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay3-card">
    <div class="relay-info">
      <img id="relay3-img" src="Light off.png">
      <span>Relay 3</span>
    </div>
    <button class="relay-btn off" id="relay3-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay4-card">
    <div class="relay-info">
      <img id="relay4-img" src="Light off.png">
      <span>Relay 4</span>
    </div>
    <button class="relay-btn off" id="relay4-btn">OFF</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const provider = new firebase.auth.GoogleAuthProvider();

const loginContainer = document.getElementById("login-container");
const dashboard = document.getElementById("dashboard");
const userInfo = document.getElementById("user-info");

let selectedDevice = null;
let relayRefs = [];

// Sign In
document.getElementById("googleSignInBtn").addEventListener("click", async () => {
  try {
    await auth.signInWithPopup(provider);
  } catch(err){
    alert("Login failed. Check console.");
    console.error(err);
  }
});

// Auth State
auth.onAuthStateChanged(user=>{
  if(user){
    loginContainer.style.display="none";
    dashboard.style.display="flex";
    userInfo.textContent=`Logged in as: ${user.displayName}`;
    loadDevices();
  } else {
    loginContainer.style.display="block";
    dashboard.style.display="none";
  }
});

document.getElementById("logoutBtn").addEventListener("click", ()=>auth.signOut());

// Relay Toggle
for(let i=1;i<=4;i++){
  document.getElementById(`relay${i}-btn`).addEventListener("click",()=>toggleRelay(i));
}

function toggleRelay(num){
  if(!selectedDevice) return;
  const path=`/Devices/${selectedDevice}/relays/Relay${num}`;
  db.ref(path).get().then(snap=>{
    const newState = snap.val()===1?0:1;
    db.ref(path).set(newState);
  });
}

// Date Time
function updateDateTime(){
  document.getElementById("datetime").textContent =
    new Date().toLocaleString();
}
setInterval(updateDateTime,1000);
updateDateTime();
</script>

</body>
</html>
