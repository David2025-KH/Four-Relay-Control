<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home Control</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow-x: hidden; /* prevent horizontal scroll */
  background: linear-gradient(135deg,#4e73df,#1cc88a);
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#login-container {
  background: white;
  padding: 50px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  text-align: center;
  width: 90%;
  max-width: 420px;
  transform: translateY(-50px);
  opacity: 0;
  animation: fadeIn 0.8s forwards;
}

@keyframes fadeIn {
  to { transform: translateY(0); opacity:1; }
}

#googleSignInBtn {
  background: linear-gradient(90deg,#4285F4,#34a853);
  color:white;
  border:none;
  border-radius:12px;
  font-size:1.1rem;
  padding:16px 30px;
  cursor:pointer;
  width:100%;
  transition: all 0.3s;
}

#googleSignInBtn:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

#dashboard {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  width: 100%;
  max-width: 480px;
  height: 100vh; /* fill screen */
  overflow-y: auto; /* allow vertical scrolling */
  box-sizing: border-box;
}

/* Scrollbar styling */
#dashboard::-webkit-scrollbar {
  width: 8px;
}
#dashboard::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.2);
  border-radius: 4px;
}

#user-info {
  font-size:1rem;
  margin-bottom:20px;
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,0.4);
}

#logoutBtn {
  padding:12px 28px;
  font-size:1rem;
  border:none;
  border-radius:12px;
  background:#f44336;
  color:white;
  cursor:pointer;
  margin-top:20px;
  transition: 0.3s;
}

#logoutBtn:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 15px rgba(0,0,0,0.25);
}

#datetime {
  font-size:1rem;
  margin-bottom:20px;
  color:white;
  text-shadow: 0 1px 4px rgba(0,0,0,0.4);
}

select#deviceSelect {
  padding:10px 14px;
  border-radius:10px;
  border:none;
  outline:none;
  font-size:1rem;
  margin-bottom:20px;
  cursor:pointer;
  background: rgba(255,255,255,0.95);
  transition: 0.3s;
}
select#deviceSelect:hover {
  transform: scale(1.02);
}

/* Relay Cards */
.relay-card {
  background: rgba(255,255,255,0.95);
  padding:20px 40px;
  margin:10px;
  border-radius:16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  max-width:350px;
  transition: transform 0.3s, box-shadow 0.3s;
}
.relay-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}
.relay-card.active {
  border-left:10px solid #4CAF50;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

button.relay-btn {
  padding:12px 28px;
  font-size:1rem;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  transition: all 0.3s;
}

button.relay-btn.on {
  background: linear-gradient(90deg,#4CAF50,#81C784);
  color:white;
  box-shadow: 0 5px 15px rgba(76,175,80,0.4);
}

button.relay-btn.off {
  background: linear-gradient(90deg,#f44336,#e57373);
  color:white;
  box-shadow: 0 5px 15px rgba(244,67,54,0.4);
}

button.relay-btn:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div id="login-container">
  <h1>Welcome to Smart Home Control</h1>
  <button id="googleSignInBtn">Sign in with Google</button>
</div>

<div id="dashboard">
  <div id="user-info"></div>
  <h2 style="color:white;">Relay Control Dashboard</h2>
  <div id="datetime"></div>

  <div>
    <label style="color:white;">Select Device:</label>
    <select id="deviceSelect"></select>
  </div>

  <div class="relay-card" id="relay1-card">
    <span>Relay 1</span>
    <button class="relay-btn off" id="relay1-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay2-card">
    <span>Relay 2</span>
    <button class="relay-btn off" id="relay2-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay3-card">
    <span>Relay 3</span>
    <button class="relay-btn off" id="relay3-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay4-card">
    <span>Relay 4</span>
    <button class="relay-btn off" id="relay4-btn">OFF</button>
  </div>

  <button id="logoutBtn">Logout</button>
</div>

<script>
// ===== Firebase Config & Init =====
const firebaseConfig = {
  apiKey: "AIzaSyDjzlI-47-q8zakU2W3MVFRxGqXyFYvnXE",
  authDomain: "data-logging-f2cfe.firebaseapp.com",
  databaseURL: "https://data-logging-f2cfe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "data-logging-f2cfe",
  storageBucket: "data-logging-f2cfe.firebasestorage.app",
  messagingSenderId: "899288602117",
  appId: "1:899288602117:web:2f41f71e7eb8dfe54bee6c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const provider = new firebase.auth.GoogleAuthProvider();

const loginContainer = document.getElementById("login-container");
const dashboard = document.getElementById("dashboard");
const userInfo = document.getElementById("user-info");

let selectedDevice = null;
let relayRefs = [];

const relayCards = {
  1: document.getElementById("relay1-card"),
  2: document.getElementById("relay2-card"),
  3: document.getElementById("relay3-card"),
  4: document.getElementById("relay4-card")
};

/* ===== SIGN IN ===== */
document.getElementById("googleSignInBtn").addEventListener("click", async () => {
  try {
    const result = await auth.signInWithPopup(provider);
    const user = result.user;

    const userRef = db.ref(`/Users/${user.uid}`);
    const snapshot = await userRef.get();

    if (!snapshot.exists()) {
      await userRef.set({
        email: user.email,
        displayName: user.displayName,
        lastLogin: Date.now(),
        banned: false
      });
    } else {
      await userRef.update({ lastLogin: Date.now() });
    }
  } catch(err){
    console.error("Login error:", err);
    alert("Login failed! Check console.");
  }
});

/* ===== AUTH LISTENER ===== */
auth.onAuthStateChanged(async (user) => {
  if(user){
    const bannedSnap = await db.ref(`/Users/${user.uid}/banned`).get();
    if(bannedSnap.val() === true){
      alert("You are banned.");
      await auth.signOut();
      return;
    }

    loginContainer.style.display = "none";
    dashboard.style.display = "flex";

    // Show only user display name
    userInfo.textContent = `Logged in as: ${user.displayName}`;

    loadDevices();
  } else {
    loginContainer.style.display = "flex";
    dashboard.style.display = "none";
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut());

/* ===== DEVICE HANDLING ===== */
function loadDevices(){
  const select = document.getElementById("deviceSelect");

  db.ref("/Devices").on("value", snapshot=>{
    const devices = snapshot.val() || {};
    const prevSelected = select.value;

    select.innerHTML = "";

    for(const dev in devices){
      const opt = document.createElement("option");
      opt.value = dev;
      opt.textContent = dev;
      select.appendChild(opt);
    }

    select.value = devices[prevSelected] ? prevSelected : select.options[0]?.value;
    selectedDevice = select.value;

    removeRelayListeners();
    setupRelayListeners(selectedDevice);
  });
}

document.getElementById("deviceSelect").addEventListener("change", e=>{
  removeRelayListeners();
  selectedDevice = e.target.value;
  setupRelayListeners(selectedDevice);
});

/* ===== RELAYS ===== */
for(let i=1; i<=4; i++){
  document.getElementById(`relay${i}-btn`)
    .addEventListener("click", () => toggleRelay(i));
}

function setupRelayListeners(deviceID){
  relayRefs.forEach(r=>r.ref.off("value", r.listener));
  relayRefs = [];

  for(let i=1;i<=4;i++){
    const path = `/Devices/${deviceID}/relays/Relay${i}`;
    const refDb = db.ref(path);

    const listener = snapshot=>{
      const state = snapshot.val() === 1;
      const btn = document.getElementById(`relay${i}-btn`);

      btn.textContent = state ? "ON" : "OFF";
      btn.className = `relay-btn ${state ? 'on' : 'off'}`;
      relayCards[i].classList.toggle("active", state);
    };

    refDb.on("value", listener);
    relayRefs.push({ ref: refDb, listener });
  }
}

function removeRelayListeners(){
  relayRefs.forEach(r=>r.ref.off("value", r.listener));
  relayRefs=[];
}

function toggleRelay(relayNum){
  if(!selectedDevice) return;

  const path = `/Devices/${selectedDevice}/relays/Relay${relayNum}`;
  db.ref(path).get().then(snapshot=>{
    const current = snapshot.val() ?? 0;
    db.ref(path).set(current === 1 ? 0 : 1);
  });
}

/* ===== TIME ===== */
function updateDateTime(){
  const now = new Date();
  const options={
    weekday:'long', year:'numeric', month:'long', day:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  };
  document.getElementById("datetime").textContent =
    now.toLocaleString('en-US', options);
}

setInterval(updateDateTime,1000);
updateDateTime();
</script>

</body>
</html>
