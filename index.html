<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Control Dashboard</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { font-family: Arial; background:#f4f6f8; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
#login-container { background:white; padding:50px; border-radius:16px; box-shadow:0 8px 20px rgba(0,0,0,0.15); text-align:center; }
#googleSignInBtn { background:#4285F4; color:white; border:none; border-radius:8px; font-size:1.1rem; padding:14px 30px; cursor:pointer; }
#dashboard { display:none; flex-direction:column; align-items:center; padding:20px; width:100%; max-width:450px; }
#logoutBtn { margin-bottom:20px; padding:10px 24px; border:none; border-radius:8px; background:#f44336; color:white; cursor:pointer; }
#datetime { margin-bottom:25px; font-size:1rem; background:white; padding:10px 20px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
.relay-card { background:white; padding:20px 30px; margin:10px; border-radius:16px; box-shadow:0 6px 16px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:space-between; width:100%; max-width:350px; }
.relay-card.active { border-left:8px solid #4CAF50; }
.relay-info { display:flex; align-items:center; gap:15px; }
.relay-info img { width:50px; height:50px; object-fit:contain; }
button.relay-btn { padding:12px 22px; font-size:1rem; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
button.relay-btn.on { background:#4CAF50; color:white; }
button.relay-btn.off { background:#f44336; color:white; }
</style>
</head>
<body>

<div id="login-container">
  <h2>Login with Google</h2>
  <button id="googleSignInBtn">Sign in with Gmail</button>
</div>

<div id="dashboard">
  <div id="user-info"></div>
  <button id="logoutBtn">Logout</button>
  <h2>Relay Control Dashboard</h2>
  <div id="datetime"></div>

  <div style="margin-bottom:20px;">
    <label>Select Device:</label>
    <select id="deviceSelect"></select>
  </div>

  <!-- Relay Cards -->
  <div class="relay-card" id="relay1-card">
    <div class="relay-info"><img id="relay1-img" src="Light off.png"><span>Relay 1</span></div>
    <button class="relay-btn off" id="relay1-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay2-card">
    <div class="relay-info"><img id="relay2-img" src="Light off.png"><span>Relay 2</span></div>
    <button class="relay-btn off" id="relay2-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay3-card">
    <div class="relay-info"><img id="relay3-img" src="Light off.png"><span>Relay 3</span></div>
    <button class="relay-btn off" id="relay3-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay4-card">
    <div class="relay-info"><img id="relay4-img" src="Light off.png"><span>Relay 4</span></div>
    <button class="relay-btn off" id="relay4-btn">OFF</button>
  </div>
</div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDjzlI-47-q8zakU2W3MVFRxGqXyFYvnXE",
  authDomain: "data-logging-f2cfe.firebaseapp.com",
  databaseURL: "https://data-logging-f2cfe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "data-logging-f2cfe",
  storageBucket: "data-logging-f2cfe.firebasestorage.app",
  messagingSenderId: "899288602117",
  appId: "1:899288602117:web:2f41f71e7eb8dfe54bee6c"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();
const provider = new firebase.auth.GoogleAuthProvider();

let selectedDevice = null;
let relayRefs = [];

// LOGIN
document.getElementById("googleSignInBtn").onclick = () => {
  auth.signInWithPopup(provider).catch(err => alert(err.message));
};

document.getElementById("logoutBtn").onclick = () => auth.signOut();

// AUTH STATE
auth.onAuthStateChanged(user => {
  if (!user) {
    document.getElementById("login-container").style.display = "flex";
    document.getElementById("dashboard").style.display = "none";
    return;
  }

  document.getElementById("login-container").style.display = "none";
  document.getElementById("dashboard").style.display = "flex";
  document.getElementById("user-info").innerText = "Logged in: " + user.email;

  loadDevices();
});

// LOAD DEVICES
function loadDevices() {
  const select = document.getElementById("deviceSelect");

  db.ref("/Devices").on("value", snapshot => {
    const devices = snapshot.val();
    if (!devices) return;

    select.innerHTML = "";

    Object.keys(devices).forEach(dev => {
      const opt = document.createElement("option");
      opt.value = dev;
      opt.textContent = dev;
      select.appendChild(opt);
    });

    selectedDevice = select.value;
    if (selectedDevice) setupRelayListeners(selectedDevice);
  });
}

document.getElementById("deviceSelect").addEventListener("change", e => {
  selectedDevice = e.target.value;
  setupRelayListeners(selectedDevice);
});

// SETUP RELAYS
function setupRelayListeners(deviceID) {

  relayRefs.forEach(r => r.ref.off());
  relayRefs = [];

  for (let i = 1; i <= 4; i++) {

    const ref = db.ref(`/Devices/${deviceID}/relays/Relay${i}`);

    const listener = ref.on("value", snapshot => {

      const state = snapshot.val() === 1;

      const btn = document.getElementById(`relay${i}-btn`);
      const card = document.getElementById(`relay${i}-card`);
      const img = document.getElementById(`relay${i}-img`);

      btn.textContent = state ? "ON" : "OFF";
      btn.className = `relay-btn ${state ? "on" : "off"}`;
      card.classList.toggle("active", state);
      img.src = state ? "Light on.png" : "Light off.png";
    });

    relayRefs.push({ ref, listener });
  }
}

// TOGGLE (SAFE TRANSACTION)
function toggleRelay(num) {
  if (!selectedDevice) return;

  const ref = db.ref(`/Devices/${selectedDevice}/relays/Relay${num}`);

  ref.transaction(current => {
    if (current === null) return 1;
    return current === 1 ? 0 : 1;
  });
}

// BUTTON LISTENER
for (let i = 1; i <= 4; i++) {
  document.getElementById(`relay${i}-btn`)
    .addEventListener("click", () => toggleRelay(i));
}

// DATE TIME
function updateDateTime() {
  document.getElementById("datetime").textContent =
    new Date().toLocaleString();
}
setInterval(updateDateTime, 1000);
updateDateTime();
</script>

</body>
</html>
