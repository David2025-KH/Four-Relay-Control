<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home Control</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#4e73df,#1cc88a);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
#login-container {
  background:white;
  padding:50px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  text-align:center;
  width:90%;
  max-width:420px;
}
#googleSignInBtn {
  background:#4285F4;
  color:white;
  border:none;
  border-radius:8px;
  font-size:1.1rem;
  padding:14px 30px;
  cursor:pointer;
  width:100%;
}
#dashboard {
  display:none;
  flex-direction:column;
  align-items:center;
  padding:20px;
  width:100%;
  max-width:450px;
}
.relay-card {
  background:white;
  padding:20px 40px;
  margin:10px;
  border-radius:14px;
  box-shadow:0 6px 14px rgba(0,0,0,0.15);
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  max-width:350px;
}
.relay-card.active { border-left:8px solid #4CAF50; }
button.relay-btn.on { background:#4CAF50; color:white; }
button.relay-btn.off { background:#f44336; color:white; }
</style>
</head>

<body>

<div id="login-container">
  <h1>Welcome to Smart Home Control</h1>
  <button id="googleSignInBtn">Sign in with Google</button>
</div>

<div id="dashboard">
  <div id="user-info"></div>
  <button id="logoutBtn">Logout</button>
  <h2>Relay Control Dashboard</h2>
  <div id="datetime"></div>

  <div>
    <label>Select Device:</label>
    <select id="deviceSelect"></select>
  </div>

  <!-- 4 Relays -->
  <div class="relay-card" id="relay1-card">
    <span>Relay 1</span>
    <button class="relay-btn off" id="relay1-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay2-card">
    <span>Relay 2</span>
    <button class="relay-btn off" id="relay2-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay3-card">
    <span>Relay 3</span>
    <button class="relay-btn off" id="relay3-btn">OFF</button>
  </div>

  <div class="relay-card" id="relay4-card">
    <span>Relay 4</span>
    <button class="relay-btn off" id="relay4-btn">OFF</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDjzlI-47-q8zakU2W3MVFRxGqXyFYvnXE",
  authDomain: "data-logging-f2cfe.firebaseapp.com",
  databaseURL: "https://data-logging-f2cfe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "data-logging-f2cfe",
  storageBucket: "data-logging-f2cfe.firebasestorage.app",
  messagingSenderId: "899288602117",
  appId: "1:899288602117:web:2f41f71e7eb8dfe54bee6c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const provider = new firebase.auth.GoogleAuthProvider();

let selectedDevice = null;
let deviceListener = null;
let relayListeners = [];

const select = document.getElementById("deviceSelect");

/* LOGIN */
document.getElementById("googleSignInBtn").onclick = async () => {
  try {
    const result = await auth.signInWithPopup(provider);
    const user = result.user;
    const userRef = db.ref(`/Users/${user.uid}`);
    const snap = await userRef.get();

    if (!snap.exists()) {
      await userRef.set({
        email: user.email,
        displayName: user.displayName,
        lastLogin: Date.now(),
        banned: false
      });
    } else {
      await userRef.update({ lastLogin: Date.now() });
    }
  } catch (err) {
    console.error(err);
    alert("Login failed!");
  }
};

/* AUTH */
auth.onAuthStateChanged(async user => {
  if (!user) {
    login-container.style.display = "block";
    dashboard.style.display = "none";
    return;
  }

  const banned = await db.ref(`/Users/${user.uid}/banned`).get();
  if (banned.val() === true) {
    alert("You are banned.");
    await auth.signOut();
    return;
  }

  login-container.style.display = "none";
  dashboard.style.display = "flex";
  document.getElementById("user-info").innerText =
    `Logged in as ${user.displayName}`;

  loadDevices();
});

document.getElementById("logoutBtn").onclick = () => auth.signOut();

/* LOAD DEVICES (STABLE) */
function loadDevices() {
  if (deviceListener) deviceListener.off();

  deviceListener = db.ref("/Devices");
  deviceListener.on("value", snapshot => {
    const devices = snapshot.val() || {};
    const prev = select.value;

    select.innerHTML = "";

    for (let dev in devices) {
      const opt = document.createElement("option");
      opt.value = dev;
      opt.textContent = dev;
      select.appendChild(opt);
    }

    if (devices[prev]) {
      select.value = prev;
    }

    selectedDevice = select.value;
    changeDevice(selectedDevice);
  });
}

select.onchange = e => {
  selectedDevice = e.target.value;
  changeDevice(selectedDevice);
};

/* RELAY LISTENER CONTROL */
function changeDevice(deviceID) {
  relayListeners.forEach(l => l.ref.off("value", l.callback));
  relayListeners = [];

  for (let i = 1; i <= 4; i++) {
    const ref = db.ref(`/Devices/${deviceID}/relays/Relay${i}`);

    const callback = snapshot => {
      const state = snapshot.val() === 1;
      const btn = document.getElementById(`relay${i}-btn`);
      const card = document.getElementById(`relay${i}-card`);

      btn.innerText = state ? "ON" : "OFF";
      btn.className = "relay-btn " + (state ? "on" : "off");
      card.classList.toggle("active", state);
    };

    ref.on("value", callback);
    relayListeners.push({ ref, callback });
  }
}

/* TOGGLE */
for (let i = 1; i <= 4; i++) {
  document.getElementById(`relay${i}-btn`).onclick = () => {
    if (!selectedDevice) return;

    const ref = db.ref(`/Devices/${selectedDevice}/relays/Relay${i}`);
    ref.get().then(snap => {
      ref.set(snap.val() === 1 ? 0 : 1);
    });
  };
}

/* TIME */
setInterval(() => {
  document.getElementById("datetime").innerText =
    new Date().toLocaleString();
}, 1000);
</script>

</body>
</html>
